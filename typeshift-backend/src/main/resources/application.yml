spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.5-flash-lite
typeshift:
  jwt-secret: ${JWT_SECRET:}
  cookie-secure: ${COOKIE_SECURE:false}
  ai:
    provider-endpoint: https://generativelanguage.googleapis.com

app:
  chat:
    model-name: ${spring.ai.google.genai.chat.options.model}
    max-memory-messages: 20
