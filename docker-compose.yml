# Local PostgreSQL for TypeShift dev.
# Start: docker compose up -d    Stop: docker compose down    Wipe data: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-typeshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password!}
      POSTGRES_DB: ${POSTGRES_DB:-typeshift}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
