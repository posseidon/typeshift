<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>TypeShift — New Employment Record</title>
</head>
<body>
  <section th:fragment="content">
    <h1>Open an employment record</h1>
    <p th:if="${error}" class="error" role="alert" th:text="${error}"></p>
    <form th:action="@{/signup}" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <label for="displayName">Display name (optional)</label>
      <input id="displayName" name="displayName" type="text" autocomplete="nickname">
      <button type="submit">Create record</button>
    </form>
    <p><a th:href="@{/login}">Already have a record? Start your shift.</a></p>
  </section>
</body>
</html>
