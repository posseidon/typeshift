<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} ?: 'TypeShift'">TypeShift</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script th:src="@{/js/engine.js}" defer></script>
</head>
<body>
  <header class="topnav">
    <a class="brand" th:href="@{/}">TypeShift</a>
    <nav>
      <a th:href="@{/stage-map}">Stage Map</a>
      <a th:href="@{/profile}">Profile</a>
      <a th:href="@{/logout}">Logout</a>
    </nav>
  </header>
  <!-- Content injection point: page controllers point the content fragment here. -->
  <main id="content" th:replace="~{${contentFragment} :: content}"></main>
  <footer class="site-footer">
    <span>Bureau Division of Typing Standards • Record Archive</span>
    <span>Form TS-882 • All Transactions Audited</span>
  </footer>
</body>
</html>
