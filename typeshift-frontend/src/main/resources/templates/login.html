<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>TypeShift — Start of Shift</title>
</head>
<body>
  <section th:fragment="content">
    <div class="auth-wrap">
      <div class="docket auth-card">
        <div class="punch-strip"></div>
        <div class="inner">
          <h1 class="headline-xl">Start your shift</h1>
          <p class="auth-sub label-caps">Bureau of Accredited Typists • Punch Clock Station</p>
          <p th:if="${error}" class="error label-caps" role="alert"
             th:text="${errorText} ?: 'Invalid username or password.'">Invalid username or password.</p>
          <form class="stack" th:action="@{/login}" method="post">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Clock in</button>
          </form>
        </div>
      </div>
      <p class="auth-links"><a th:href="@{/signup}">No employment record yet? Open one.</a></p>
    </div>
  </section>
</body>
</html>
